<title>The ET Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fab / engineering-drawing language. Opens on a photoreal silicon die; the ET mark
   dives through a transistor array into one MOSFET cross-section with callouts and leader lines;
   tracks open as full panels; guide pages read like a technical document with hairline rules. */
:root{
  --bg:#0A0B10;
  --bg-2:#0E1016;
  --panel:#141720;
  --line:#242938;
  --fg:#ECEDF2;
  --muted:#9299AB;
  --dim:#5F6678;
  --analog:#3CC8E2; --digital:#F2B33D; --embedded:#7EDB6A;
  --c:#ECEDF2;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
html.locked,html.locked body{overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--c);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{margin:0;font:500 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.xp{font-stretch:125%}

/* ---------- Device stage: die → array → transistor ---------- */
.device{position:relative;height:100vh;height:100svh}
.device.pinned{height:240vh}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#151821 0%,var(--bg) 70%)}
.sticky::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.gl-host,.leaders,.tags{position:absolute;inset:0}
.gl-host{will-change:transform,filter,opacity;transform-origin:50% 50%}
.gl-host canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.leaders{width:100%;height:100%;pointer-events:none;overflow:visible}
.tags{pointer-events:none}
.lead{fill:none;stroke:var(--muted);stroke-width:1;opacity:.6;transition:opacity .4s,stroke .4s}
.ldot{fill:var(--fg);stroke:var(--bg);stroke-width:1.5;transition:opacity .4s,fill .4s}
.lead-term{stroke:var(--fg);opacity:.75}
.is-on .lead-term{stroke:var(--c);opacity:.95}
.is-on .ldot-term{fill:var(--c)}
.is-on .lead-anat,.is-on .ldot-anat,.is-on .tag-anat{opacity:0}
.tag{position:absolute;left:0;top:0;will-change:transform;transition:opacity .4s}
.tag-anat{font:400 12px/1.2 var(--mono);color:#C3C8D4;white-space:nowrap;letter-spacing:.02em;background:color-mix(in oklab,var(--bg) 72%,transparent);padding:3px 6px}
.tag-term{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border:1px solid var(--line);background:color-mix(in oklab,var(--bg) 82%,transparent);border-radius:2px;cursor:pointer;text-align:left;transition:border-color .3s,background-color .3s,opacity .4s}
.sym{flex:none;display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--fg);font:500 13px/1 var(--mono);transition:border-color .3s,color .3s,background-color .3s}
.tbody{display:grid;gap:2px}
.tname{font:800 15px/1 var(--display);font-stretch:125%;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tsub{font:400 10px/1.2 var(--mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap;display:none}
.is-on .tag-term{border-color:color-mix(in oklab,var(--c) 55%,transparent)}
.is-on .tag-term .sym{border-color:var(--c);color:var(--c)}
.is-on .tag-term .tname{color:var(--c)}
.is-on .tag-term .tsub{display:block}
.tag-term.is-hot,.tag-term:hover{background:color-mix(in oklab,var(--c) 14%,var(--bg))}
.is-on .tag-term.is-hot .sym,.is-on .tag-term:hover .sym{background:var(--c);color:var(--bg)}
@media (max-width:700px){ .wide-only{display:none} .is-on .tag-term .tsub{display:none} .tname{font-size:13px} .tag-term{padding:6px 9px 6px 6px;gap:8px} .sym{width:22px;height:22px;font-size:12px} }

/* per-level visibility */
.tags,.leaders,.console,.et,.level-ui,.et-hot,.caption{transition:opacity .45s}
.stage:not([data-level="fet"]) .tags,.stage:not([data-level="fet"]) .leaders,.stage:not([data-level="fet"]) .console,.stage:not([data-level="fet"]) .et,.stage:not([data-level="fet"]) .vgs-panel{opacity:0;pointer-events:none}
.stage.is-zooming .vgs-panel{opacity:0;pointer-events:none}
.vgs-panel{transition:opacity .45s}
.stage[data-level="fet"] .level-ui,.stage[data-level="transit"] .level-ui,.stage[data-level="fet"] .et-hot,.stage[data-level="transit"] .et-hot{opacity:0;pointer-events:none}
.stage.is-zooming .tags,.stage.is-zooming .leaders,.stage.is-zooming .console,.stage.is-zooming .brand{opacity:0;pointer-events:none}
.stage:not([data-level="transit"]) .caption{opacity:0}

.brand{position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:48px;pointer-events:none;transition:opacity .35s;background:linear-gradient(to bottom,rgba(10,11,16,.88) 0%,rgba(10,11,16,.6) 60%,transparent)}
.brand .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.et{margin:0 0 10px;font:900 clamp(64px,11vw,156px)/.8 var(--display);font-stretch:125%;letter-spacing:-.03em}
.tagline{margin:0;font:500 clamp(11px,1.2vw,13px)/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.statement{margin:12px 0 0;max-width:30ch;font:700 clamp(15px,1.6vw,19px)/1.3 var(--display);font-stretch:112%;color:var(--fg);text-wrap:balance}
.brand-r{display:grid;justify-items:end;gap:10px}
.marking{margin:0;text-align:right;font:400 11px/1.7 var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.zoom-out{pointer-events:auto}
@media (max-width:700px){.marking{display:none}.brand .wrap{flex-direction:column;gap:8px}.brand-r{justify-items:start}}

.console,.level-ui,.caption{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-top:40px;background:linear-gradient(to top,rgba(10,11,16,.85),transparent)}
.console .wrap,.level-ui .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.readout,.cap{margin:0;font:500 13px/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.readout b{font-weight:500;color:var(--fg)}
.readout .st{color:var(--fg)}
.is-on .readout .st{color:var(--embedded)}
.hint{margin:0;flex:1;min-width:200px;font:400 13px/1.4 var(--mono);color:var(--muted);text-align:center}
.level-ui .hint{color:var(--fg)}
/* scale rail: jump between wafer, die, array and MOSFET */
.scale{position:relative;display:grid;margin-top:4px;pointer-events:auto}
.scale::before{content:"";position:absolute;right:5px;top:14px;bottom:14px;width:1px;background:var(--line)}
.scale button{display:grid;grid-template-columns:auto auto 11px;align-items:center;justify-content:end;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--muted);font:500 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;text-align:right;transition:color .2s}
.scale .s{color:var(--dim);font-size:11px;text-transform:none;letter-spacing:.02em}
.scale i{position:relative;width:11px;height:11px;border:1px solid var(--muted);background:var(--bg);transition:background-color .2s,border-color .2s}
.scale button:hover,.scale button:focus-visible{color:var(--fg)}
.scale button.is-on{color:var(--fg)}
.scale button.is-on i{background:var(--fg);border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in oklab,var(--fg) 20%,transparent)}
.scale button:disabled{cursor:default;opacity:.55}
@media (max-width:700px){
  .scale{display:flex;gap:16px;margin-top:2px}
  .scale::before{display:none}
  .scale button{grid-template-columns:11px auto;gap:7px}
  .scale i{order:-1}
  .scale .s{display:none}
}
.switch,.ghost{display:inline-flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:8px 14px 8px 8px;cursor:pointer;font:600 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.ghost{padding:10px 14px;font-weight:500;font-size:12px;color:var(--muted);background:color-mix(in oklab,var(--bg) 70%,transparent)}
.ghost:hover,.switch:hover{border-color:var(--muted);color:var(--fg)}
.switch .trk{position:relative;width:44px;height:22px;border:1px solid var(--muted);background:var(--bg)}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--muted);transition:transform .3s,background-color .3s}
.switch[aria-pressed="true"] .trk{border-color:var(--embedded)}
.switch[aria-pressed="true"] .knob{transform:translateX(22px);background:var(--embedded)}
@media (max-width:700px){.hint{order:3;flex-basis:100%;text-align:left}}

/* vertical gate-voltage slider on the right */
.vgs-panel{position:absolute;top:50%;right:max(28px,calc(env(safe-area-inset-right,0px) + 16px));transform:translateY(-46%);display:grid;justify-items:center;gap:8px;z-index:2}
.vp-label{margin:0;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vp-val{margin:0 0 6px;font:500 13px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.vp-val b{color:var(--fg);font-weight:500}
.vtrack{position:relative;width:44px;height:clamp(200px,44vh,400px);cursor:pointer;touch-action:none;outline:none}
.vtrack::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:10px;background:linear-gradient(to top,#4A5163 0 27.78%,#F2B33D 27.78% 83.33%,#7EDB6A 83.33% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.vtrack:focus-visible::before{outline:1px solid var(--fg);outline-offset:4px}
.vgs-panel .vtrack{height:clamp(200px,44vh,400px)}
.vthumb{position:absolute;left:4px;bottom:-6px;width:36px;height:12px;background:var(--fg);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--muted),0 4px 14px rgba(0,0,0,.5);pointer-events:none}
.vtrack.is-drag .vthumb,.vtrack:hover .vthumb{box-shadow:0 0 0 1px var(--fg),0 4px 18px rgba(0,0,0,.6)}
.vz{position:absolute;right:calc(100% + 6px);transform:translateY(50%);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.vz-cut{bottom:13.89%;color:var(--muted)} .vz-sat{bottom:55.55%;color:#F2B33D} .vz-tri{bottom:91.66%;color:#7EDB6A}
.vt{position:absolute;left:calc(100% + 4px);transform:translateY(50%);font:400 10px/1 var(--mono);color:var(--dim);white-space:nowrap;pointer-events:none}
@media (max-width:700px){.vgs-panel{right:max(10px,env(safe-area-inset-right,0px))}.vz,.vp-label{display:none}.vtrack{height:clamp(170px,34vh,300px);width:36px}.vtrack::before{left:13px}.vthumb{left:2px;width:32px}.vt{font-size:9px}}
/* gate-voltage readout */
.readout{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.readout span{white-space:nowrap}
.region{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border:1px solid var(--line);color:var(--muted);transition:color .3s,border-color .3s}
.region[data-r="saturation"]{color:#F2B33D;border-color:color-mix(in oklab,#F2B33D 55%,transparent)}
.region[data-r="triode"]{color:#7EDB6A;border-color:color-mix(in oklab,#7EDB6A 55%,transparent)}
.console .hint{order:3;flex-basis:100%;text-align:left}

/* the clickable ET die on the wafer */
.et-hot{position:absolute;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:none;border:0;cursor:pointer;padding:0}
.et-hot::before,.et-hot::after{content:"";position:absolute;inset:18px;border:1.5px solid #F2B33D;border-radius:50%;opacity:.9}
.et-hot::after{inset:4px;border-width:1px;opacity:0;animation:ping 2s cubic-bezier(.2,.6,.3,1) infinite}
.et-hot:hover::before,.et-hot:focus-visible::before{inset:12px;border-width:2px}
@keyframes ping{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.et-hot span{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#F2B33D;background:color-mix(in oklab,var(--bg) 75%,transparent);padding:3px 6px}

/* no WebGL: plain terminal row */
.stage.no-gl .tags{position:absolute;inset:auto 0 42%;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;padding:0 16px}
.stage.no-gl .tag{position:static;transform:none!important}
.stage.no-gl .tag-anat,.stage.no-gl .leaders{display:none}

@media (prefers-reduced-motion:reduce){.et-hot::after{animation:none}}

/* ---------- Index strip ---------- */
.index{border-top:1px solid var(--line)}
.index .wrap{display:grid;gap:32px;padding-block:72px}
.index .intro{margin:0;max-width:62ch;font-size:clamp(18px,2vw,22px);line-height:1.5;color:var(--fg);text-wrap:pretty}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.trk-btn{display:grid;gap:10px;align-content:start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:24px 20px 28px 0;cursor:pointer;transition:background-color .2s}
.trk-btn + .trk-btn{border-left:1px solid var(--line);padding-left:20px}
.trk-btn .k{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.trk-btn .n{font:800 clamp(30px,4vw,48px)/1 var(--display);font-stretch:125%;letter-spacing:-.01em;transition:color .2s}
.trk-btn .m{font:400 12px var(--mono);color:var(--muted)}
.trk-btn:hover .n,.trk-btn:focus-visible .n{color:var(--c)}
@media (max-width:760px){.tracks{grid-template-columns:minmax(0,1fr)}.trk-btn + .trk-btn{border-left:0;padding-left:0}}

/* ---------- Track panel ---------- */
.zoom{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;background-color:var(--bg);
  background-image:
    radial-gradient(90% 60% at 100% 0%,color-mix(in oklab,var(--c) 22%,transparent),transparent 65%),
    linear-gradient(color-mix(in oklab,var(--c) 6%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in oklab,var(--c) 6%,transparent) 1px,transparent 1px);
  background-size:auto,72px 72px,72px 72px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.zoom-inner{display:grid;gap:16px;padding-block:22px 88px}
.zoom-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px 14px;cursor:pointer;transition:color .2s,border-color .2s}
.back:hover{color:var(--fg);border-color:var(--c)}
.zoom-head{display:flex;align-items:flex-end;gap:clamp(14px,2vw,28px);margin-top:32px;flex-wrap:wrap}
.big-sym{display:grid;place-items:center;width:clamp(58px,8vw,104px);aspect-ratio:1;max-width:100%;border:2px solid var(--c);color:var(--c);font:500 clamp(28px,4vw,52px)/1 var(--mono)}
.zoom h2{margin:0;font:900 clamp(56px,12vw,168px)/.82 var(--display);font-stretch:125%;letter-spacing:-.035em;color:var(--fg)}
.zoom-blurb{margin:8px 0 0;max-width:58ch;color:var(--muted);font-size:clamp(16px,1.8vw,19px)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:36px;border-top:1px solid var(--line)}
.col{min-width:0;padding:22px 22px 8px 0}
.col + .col{border-left:1px solid var(--line);padding-left:22px}
.col-head{display:grid;gap:6px;padding-bottom:14px}
.col-head h3{margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:12px;font:800 22px/1.1 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:.02em}
.col-head h3 span{font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:none}
.col-head p{margin:0;font-size:14px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.row{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:13px 6px 13px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;transition:background-color .2s,padding .25s}
.row:hover,.row:focus-visible{background:color-mix(in oklab,var(--c) 10%,transparent);padding-left:8px}
.row:focus-visible{outline-offset:-1px}
.dot{width:8px;height:8px;border:1px solid var(--dim);transform:translateY(-1px)}
.dot.on{background:var(--c);border-color:var(--c);box-shadow:0 0 8px var(--c)}
.row-name{font:600 16px/1.3 var(--body);min-width:0}
.row-term{grid-column:2;font:400 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.legend{margin:18px 0 0;display:flex;gap:18px;flex-wrap:wrap;font:400 11px var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.legend span{display:inline-flex;align-items:center;gap:8px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.col + .col{border-left:0;padding-left:0;border-top:1px solid var(--line)}.col{padding-right:0}}

/* primer call-to-action in a track panel */
.primer-cta{width:100%;margin-top:30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 24px;border:1px solid color-mix(in oklab,var(--c) 55%,transparent);background:color-mix(in oklab,var(--c) 8%,var(--bg));cursor:pointer;text-align:left;transition:background-color .2s}
.primer-cta:hover,.primer-cta:focus-visible{background:color-mix(in oklab,var(--c) 15%,var(--bg))}
.primer-cta .pk{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c);writing-mode:vertical-rl;transform:rotate(180deg)}
.primer-cta .pt{display:block;margin:0 0 6px;font:800 clamp(22px,3vw,30px)/1.05 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:.01em}
.primer-cta .pd{display:block;color:var(--muted);max-width:60ch}
.primer-cta .go{font:500 22px/1 var(--mono);color:var(--c);transition:transform .2s}
.primer-cta:hover .go{transform:translateX(5px)}
.then{margin:30px 0 0;font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){.primer-cta{grid-template-columns:minmax(0,1fr) auto}.primer-cta .pk{display:none}}

/* primer page */
.prose{display:grid;gap:16px;max-width:64ch}
.prose p{margin:0;font-size:17px;line-height:1.65}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.steps li{counter-increment:st;background:var(--bg-2);padding:18px 18px 20px;display:grid;gap:8px;align-content:start}
.steps li::before{content:counter(st,decimal-leading-zero);font:500 13px var(--mono);color:var(--c)}
.steps h3{margin:0;font:700 18px/1.25 var(--body)}
.steps p{margin:0;font-size:14px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.role{border:1px solid var(--line);border-top:2px solid var(--c);background:var(--panel);padding:18px 18px 16px;display:grid;gap:8px;align-content:start}
.role h3{margin:0;font:700 18px/1.25 var(--body)}
.role p{margin:0;font-size:15px}
.role .tl{font:400 12px/1.4 var(--mono);color:var(--muted)}
.next-row{display:flex;flex-wrap:wrap;gap:10px}

/* section list in a track panel */
.secs{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--line)}
.sec-row{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px 8px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;transition:background-color .2s,padding .25s}
.sec-row:hover,.sec-row:focus-visible{background:color-mix(in oklab,var(--c) 9%,transparent);padding-left:18px}
.sec-row:focus-visible{outline-offset:-1px}

<script>
(async function(){
"use strict";
// all site text lives in content.json (edited through Pages CMS)
let C = null;
try { const r = await fetch('content.json', { cache:'no-cache' }); if (r.ok) C = await r.json(); } catch (e) {}
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
// NMOS square-law model for the V_GS slider
const VTH = 0.5, VDS = 1.0, KN = 1.0, VMAX = 1.8;
function drainCurrent(v){ const ov = v - VTH; if (ov <= 0) return 0; return VDS < ov ? KN * (ov * VDS - VDS * VDS / 2) : 0.5 * KN * ov * ov; }
const IDMAX = drainCurrent(VMAX);

if (!C || !C.tracks) {
  document.body.insertAdjacentHTML('afterbegin', '<p class="load-error">The content file (content.json) did not load. If you opened index.html straight from your computer, run it through a local server or open the GitHub Pages link instead.</p>');
  return;
}

/* ---- GSAP stand-in: apply end states instantly if the library fails to load ---- */
const SKIP = ['duration','ease','delay','stagger','onComplete','onUpdate'];
function applyVars(t, v){
  const list = typeof t === 'string' ? Array.from(document.querySelectorAll(t)) : (Array.isArray(t) ? t : [t]);
  list.forEach(x => { for (const k in v) { if (SKIP.includes(k)) continue; if (x && x.style && !(k in x)) x.style[k] = v[k]; else if (x) x[k] = v[k]; } });
  v.onUpdate && v.onUpdate();
}
const FAKE = {
  to(t, v){ applyVars(t, v); v.onComplete && v.onComplete(); return FAKE; },
  fromTo(t, a, b){ return FAKE.to(t, b); },
  from(){ return FAKE; },
  timeline(o){ o = o || {}; const tl = { to(t, v){ applyVars(t, v); return tl; }, call(f){ f(); return tl; } }; setTimeout(() => o.onComplete && o.onComplete(), 0); return tl; }
};
const G = window.gsap || FAKE;
if (window.gsap) window.gsap.ticker.lagSmoothing(0);

/* ---- data ---- */
const tracks = C.tracks.map(t => {
  const list = (t.sections || []).filter(x => x && x.id).map(x => Object.assign({}, x, { title:x.title || x.id }));
  return Object.assign({}, t, { term: String(t.terminal || '').toLowerCase(), fullName: t.name + ' track', list });
});
const byId = Object.fromEntries(tracks.map(t => [t.id, t]));
const byTerm = Object.fromEntries(tracks.map(t => [t.term, t]));

$('#tagline').textContent = C.site.tagline || '';
$('#statement').textContent = C.site.statement || '';
$('#intro').textContent = C.site.intro || '';

let pendingOrigin = null;
$('#tracks').innerHTML = tracks.map(t => {
  return `<button class="trk-btn" type="button" data-id="${esc(t.id)}" style="--c:${esc(t.color)}">
    <span class="k">${esc(t.terminal)} terminal</span>
    <span class="n">${esc(t.name)}</span>
    <span class="m">${t.list.map(x => esc(x.title)).join(' · ')}</span></button>`;
}).join('');
$('#tracks').addEventListener('click', e => {
  const b = e.target.closest('.trk-btn'); if (!b) return;
  const r = b.getBoundingClientRect(); pendingOrigin = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  go(b.dataset.id);
});

/* ---- labels on the transistor ---- */
const D = 3.6, ZF = D / 2 + 0.03;
const LABELS = [
  { term:'gate',   sym:'G', name:'Gate',   anchor:[0, 2.42, 0],     dx:0,    dy:-90 },
  { term:'source', sym:'S', name:'Source', anchor:[-3.3, 2.42, 0],  dx:-150, dy:-34 },
  { term:'drain',  sym:'D', name:'Drain',  anchor:[3.3, 2.42, 0],   dx:150,  dy:-34 },
  { text:'Copper interconnect',      anchor:[3.95, 2.2, 1.72],   dx:120,  dy:-6,  wide:true },
  { text:'Polysilicon gate',         anchor:[1.0, 0.5, ZF],      dx:240,  dy:20 },
  { text:'Gate oxide · SiO₂',        anchor:[1.3, 0.035, ZF],    dx:220,  dy:60 },
  { text:'n⁺ drain',                 anchor:[3.5, -0.45, ZF],    dx:120,  dy:70, wide:true },
  { text:'Shallow trench isolation', anchor:[5.25, -0.6, ZF],    dx:70,   dy:40, wide:true },
  { text:'Tungsten contact',         anchor:[-3.3, 1.3, 1.1],    dx:-120, dy:-10, wide:true },
  { text:'Nitride spacer',           anchor:[-1.62, 0.3, ZF],    dx:-200, dy:30, wide:true },
  { text:'n⁺ source',                anchor:[-3.5, -0.45, ZF],   dx:-120, dy:70 },
  { text:'p-type substrate · Body',  anchor:[-2.4, -2.2, ZF],    dx:-150, dy:46 },
  { text:'Channel',                  anchor:[0, -0.03, ZF],      dx:0,    dy:130 }
];

const ui = { on:false };
const stageEl = $('#stage');
const deviceEl = $('#device');

function webglOK(){
  try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); }
  catch (e) { return false; }
}
const wait = ms => new Promise(r => { if (RM || !window.gsap) setTimeout(r, 0); else window.gsap.delayedCall(ms / 1000, r); });
const tw = (target, vars) => new Promise(r => G.to(target, Object.assign({}, vars, { onComplete: r })));

const device = (function(){
  const svg = $('#leaders'), tagsEl = $('#tags'), host = $('#gl-host');
  const NS = 'http://www.w3.org/2000/svg';
  let hoverTerm = null;
  const terms = ['source', 'gate', 'drain'];

  LABELS.forEach(L => {
    let el;
    if (L.term) {
      const tr = byTerm[L.term];
      el = document.createElement('button');
      el.type = 'button'; el.className = 'tag tag-term';
      el.style.setProperty('--c', tr ? tr.color : '#ECEDF2');
      el.innerHTML = `<span class="sym">${L.sym}</span><span class="tbody"><span class="tname">${L.name}</span><span class="tsub">${tr ? tr.list.map(x => esc(x.title)).join(" · ") : ""}</span></span>`;
      el.setAttribute('aria-label', `${L.name} terminal`);
      el.addEventListener('click', () => terminalClick(L.term));
      el.addEventListener('pointerenter', () => { hoverTerm = L.term; });
      el.addEventListener('pointerleave', () => { if (hoverTerm === L.term) hoverTerm = null; });
      el.addEventListener('focus', () => { hoverTerm = L.term; });
      el.addEventListener('blur', () => { if (hoverTerm === L.term) hoverTerm = null; });
    } else {
      el = document.createElement('span');
      el.className = 'tag tag-anat' + (L.wide ? ' wide-only' : '');
      el.textContent = L.text;
    }
    tagsEl.appendChild(el); L.el = el;
    const kind = L.term ? 'term' : 'anat';
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', `lead lead-${kind}${L.wide ? ' wide-only' : ''}`);
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', L.term ? '3.5' : '2.6');
    dot.setAttribute('class', `ldot ldot-${kind}${L.wide ? ' wide-only' : ''}`);
    if (L.term && byTerm[L.term]) { path.style.setProperty('--c', byTerm[L.term].color); dot.style.setProperty('--c', byTerm[L.term].color); }
    svg.appendChild(path); svg.appendChild(dot);
    L.path = path; L.dot = dot;
  });

  const api = {

  if (ui.on === on) return;
  ui.on = on;
  stageEl.classList.toggle('is-on', on);
  $('#hint').textContent = on
    ? 'Conducting. Each terminal is now a track. Pick one to go in.'
    : 'Raise the gate voltage past 0.5 V to switch the transistor on.';
  LABELS.forEach(L => {
    if (!L.term) return;
    const tr = byTerm[L.term];
    const name = L.el.querySelector('.tname');
    if (animate) scramble(name, on ? (tr ? tr.name : L.name) : L.name);
    else name.textContent = on ? (tr ? tr.name : L.name) : L.name;
    L.el.setAttribute('aria-label', on && tr ? `${tr.name} track, ${L.name} terminal` : `${L.name} terminal`);
  });
}
function terminalClick(term){
  if (!ui.on) { rampVgs(1.0); return; }
  const tr = byTerm[term]; if (tr) go(tr.id);
}

/* ---- overlays ---- */
const zoom = $('#zoom'), page = $('#page');
const state = { group:null, item:null, viaDevice:false };
const lock = on => document.documentElement.classList.toggle('locked', on);
const R = () => Math.ceil(Math.hypot(window.innerWidth, window.innerHeight)) + 40;
function go(hash){ if (location.hash.slice(1) === hash) route(true); else location.hash = hash; }

function fillZoom(g){
  zoom.style.setProperty('--c', g.color);
  $('#zoom-eyebrow').textContent = `${g.terminal} terminal · ${g.list.length} sections`;
  $('#zoom-sym').textContent = (g.terminal || g.name).charAt(0);
  $('#zoom-title').textContent = g.name;
  $('#zoom-blurb').textContent = g.blurb || '';
  $('#zoom-secs').innerHTML = g.list.map((x, i) => `<li class="reveal"><button class="sec-row" type="button" data-id="${esc(x.id)}">
      <span class="sn">${String(i + 1).padStart(2, '0')}</span>
      <span class="sb"><span class="st">${esc(x.title)}</span>${x.summary ? `<span class="sd">${esc(x.summary)}</span>` : ''}</span>
      <span class="go" aria-hidden="true">→</span></button></li>`).join('') || '<li class="empty">No sections yet. Add them in Pages CMS.</li>';
}
$('#zoom-secs').addEventListener('click', e => {
  const b = e.target.closest('.sec-row'); if (!b || !state.group) return;
  go(`${state.group.id}--${b.dataset.id}`);
});

async function openGroup(g, animate){
  state.group = g;
  fillZoom(g);
  const anim = animate && !RM;
  const viaDevice = device.ok && device.inView() && !pendingOrigin;
  state.viaDevice = viaDevice;
  if (!ui.on) setVgs(1.0, false);
  let o;
  if (anim && viaDevice) { await device.enter(g.term, true); o = device.origin(g.term); }
  else { if (device.ok) await device.enter(g.term, false); o = pendingOrigin || { x:innerWidth / 2, y:innerHeight / 2 }; }
  state.origin = o; pendingOrigin = null;
  lock(true);
  zoom.scrollTop = 0; zoom.hidden = false;
  if (anim) {
    G.fromTo(zoom, { opacity:0 }, { opacity:1, duration:0.45, ease:'power2.out' });
    G.from('#zoom .reveal', { y:18, opacity:0, stagger:0.05, duration:0.45, delay:0.15, ease:'power3.out' });
  } else zoom.style.opacity = '1';
  $('#zoom-back').focus({ preventScroll:true });
}

function closeGroup(animate){
  const g = state.group; if (!g) return Promise.resolve();
  state.group = null;
  const anim = animate && !RM;
  return new Promise(res => {
    const finish = () => {
      zoom.hidden = true; zoom.style.opacity = '';
      lock(false);
      device.exit(anim && device.inView());
      res();
    };
    if (anim) G.to(zoom, { opacity:0, duration:0.35, ease:'power2.in', onComplete: finish });
    else finish();
  });
}

/* ---- section pages (Philosophy, Learning route, Careers, and any added later) ---- */
// A small, safe Markdown renderer: headings, paragraphs, lists, bold, italic, code and links.
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    const raw = u.replace(/&amp;/g, '&');
    if (!/^(https?:\/\/|mailto:|#|\/)/i.test(raw)) return t;
    return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
  });
  return s;
}
function slug(s){ return 'h-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function md(src){
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  let html = '', para = [], list = null;
  const heads = [];
  const flushP = () => { if (para.length) { html += `<p>${mdInline(para.join(' '))}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join('')}</${list.t}>`; list = null; } };
  lines.forEach(line => {
    const h = line.match(/^(#{1,3})\s+(.*)$/), ul = line.match(/^\s*[-*]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (h) {
      flushP(); flushL();
      const text = h[2].trim(), lvl = h[1].length <= 2 ? 2 : 3;
      if (lvl === 2) { const id = slug(text); heads.push({ id, text }); html += `<h2 id="${id}" data-spy>${mdInline(text)}</h2>`; }
      else html += `<h3>${mdInline(text)}</h3>`;
    } else if (ul || ol) {
      flushP();
      const t = ul ? 'ul' : 'ol';
      if (!list || list.t !== t) { flushL(); list = { t, items:[] }; }
      list.items.push((ul || ol)[1]);
    } else if (!line.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(line.trim()); }
  });
  flushP(); flushL();
  return { html, heads };
}

function renderPage(g, item){
  page.style.setProperty('--c', g.color);
  $('#page-back').innerHTML = `<span aria-hidden="true">←</span> ${esc(g.name)}`;
  $('#bar-title').textContent = item.title;
  const i = g.list.indexOf(item), prev = g.list[i - 1], next = g.list[i + 1];
  const { html:body, heads } = md(item.body);
  let html = `<header class="doc-head" id="top-of-page" data-spy>
    <p class="eyebrow">${esc(g.name)} · ${String(i + 1).padStart(2, '0')} of ${String(g.list.length).padStart(2, '0')}</p>
    <h1 id="doc-title">${esc(item.title)}</h1>
    ${item.summary ? `<p class="lead">${esc(item.summary)}</p>` : ''}
    ${item.draft ? '<p class="sample-note">Draft written to get you started. Rewrite it in your own words in Pages CMS, then switch off the draft note.</p>' : ''}
  </header>`;
  html += `<div class="md">${body || '<p class="empty">Nothing written here yet.</p>'}</div>`;
  html += `<nav class="pager" aria-label="More in ${esc(g.name)}">
    ${prev ? `<button type="button" class="pg" data-go="${esc(g.id)}--${esc(prev.id)}"><span class="pl">Previous</span><span class="pt">← ${esc(prev.title)}</span></button>` : '<span></span>'}
    ${next ? `<button type="button" class="pg nx" data-go="${esc(g.id)}--${esc(next.id)}"><span class="pl">Next</span><span class="pt">${esc(next.title)} →</span></button>`
           : `<button type="button" class="pg nx" data-go="${esc(g.id)}"><span class="pl">Done</span><span class="pt">Back to ${esc(g.name)} →</span></button>`}
  </nav>`;
  $('#doc').innerHTML = html;
  const toc = [{ id:'top-of-page', text:item.title }].concat(heads);
  $('#toc').innerHTML = heads.length ? toc.map(h => `<button type="button" data-sec="${h.id}">${esc(h.text)}</button>`).join('') : '';
  page.classList.toggle('no-toc', !heads.length);
  spy();
}
$('#doc').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const sec = document.getElementById(b.dataset.sec); if (!sec) return;
  const top = sec.getBoundingClientRect().top - page.getBoundingClientRect().top + page.scrollTop - 80;
  page.scrollTo({ top:Math.max(0, top), behavior: RM ? 'auto' : 'smooth' });
});

let spyObs = null;
function spy(){
  if (spyObs) spyObs.disconnect();
  const btns = Array.from(document.querySelectorAll('#toc button'));
  if (!btns.length) return;
  const setOnBtn = id => btns.forEach(b => {
    const on = b.dataset.sec === id; b.classList.toggle('is-on', on);
    if (on && window.innerWidth <= 860) b.scrollIntoView({ block:'nearest', inline:'nearest' });
  });
  setOnBtn(btns[0].dataset.sec);
  spyObs = new IntersectionObserver(es => {
    es.forEach(en => { if (en.isIntersecting) setOnBtn(en.target.id); });
  }, { root: page, rootMargin:'-20% 0px -70% 0px' });
  document.querySelectorAll('#doc [data-spy]').forEach(s => spyObs.observe(s));
}

function openPage(g, item, animate){
  state.item = item;
  renderPage(g, item);
  page.hidden = false; page.scrollTop = 0;
  lock(true);
  if (animate && !RM) G.fromTo(page, { opacity:0, y:28 }, { opacity:1, y:0, duration:0.45, ease:'power3.out' });
  else { page.style.opacity = '1'; page.style.transform = 'none'; }
  $('#page-back').focus({ preventScroll:true });
}
function closePage(animate){
  if (!state.item) return Promise.resolve();
  state.item = null;
  return new Promise(res => {
    const finish = () => { page.hidden = true; if (!state.group) lock(false); res(); };
    if (animate && !RM) G.to(page, { opacity:0, y:18, duration:0.25, ease:'power2.in', onComplete: finish });
    else finish();
  });
}

$('#zoom-back').addEventListener('click', () => go(''));
$('#page-back').addEventListener('click', () => { if (state.group) go(state.group.id); });
$('#page-home').addEventListener('click', () => go(''));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.item && state.group) go(state.group.id);
  else if (state.group) go('');
});

/* ---- routing: #track or #track--entry ---- */
let queue = Promise.resolve();
function route(animate){ queue = queue.then(() => doRoute(animate)).catch(err => console.error(err)); }
async function doRoute(animate){
  let raw = '';
  try { raw = decodeURIComponent(location.hash.slice(1)); } catch (e) { raw = ''; }
  const parts = raw.split('--'), g = byId[parts[0]];
  if (!g) { await closePage(animate); await closeGroup(animate); return; }
  if (state.group && state.group.id !== g.id) { await closePage(false); await closeGroup(false); }
  const item = parts[1] ? g.list.find(x => x.id === parts[1]) : null;
  if (!state.group) await openGroup(g, animate && !item);
  if (item) { if (state.item !== item) openPage(g, item, animate); }
  else await closePage(animate);
}
window.addEventListener('hashchange', () => route(true));
if (location.hash.length > 1 && device.ok) device.toFet(false);
route(false);
})();
</script>
