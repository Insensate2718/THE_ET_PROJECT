# Pages CMS configuration: turns content.json into editable forms.
# Edit at https://app.pagescms.org after signing in with GitHub.
content:
  - name: et
    label: ET content
    type: file
    path: content.json
    format: json
    fields:
      - name: site
        label: Home screen
        type: object
        fields:
          - { name: tagline, label: "Tagline", type: string }
          - { name: statement, label: "Headline statement", type: text }
          - { name: intro, label: "Intro paragraph", type: text }
      - name: tracks
        label: "Tracks (Analog = Source, Digital = Gate, Embedded = Drain)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, label: "ID (used in links, keep it short, no spaces)", type: string }
          - { name: terminal, label: "Terminal (Source, Gate or Drain)", type: string }
          - { name: name, label: "Track name", type: string }
          - { name: color, label: "Colour (hex, e.g. #3CC8E2)", type: string }
          - { name: blurb, label: "One-line description", type: text }
          - name: sections
            label: "Sections (shown in this order; add more anytime)"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: id, label: "ID (lowercase, hyphens, unique in this track, e.g. learning-route)", type: string }
              - { name: title, label: "Title", type: string }
              - { name: summary, label: "One-line summary (shown in the track list)", type: text }
              - { name: draft, label: "Show the draft note", type: boolean }
              - { name: body, label: "Page text. Markdown: ## Heading, - bullet, 1. numbered, **bold**, *italic*, [link text](https://...)", type: text }
